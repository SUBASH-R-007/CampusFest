ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/backend/public
    # This container is for Render's HTTPS-only public ingress.
    # No forwarded client header is trusted to set secure-cookie policy.
    SetEnv HTTPS on
    <Directory /var/www/html/backend/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
